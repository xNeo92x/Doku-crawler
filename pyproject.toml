[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docharbor"
version = "1.0.0"
description = "Parallel desktop documentation archiver"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "aiohttp>=3.11,<4", "beautifulsoup4>=4.12,<5", "markdownify>=1.1,<2"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
docharbor = "docharbor.app:main"
docharbor-cli = "docharbor.cli:main"

[tool.setuptools.packages.find]
include = ["docharbor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
